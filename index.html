<html lang="id">
<head>

<title>OMARXLUA — Official Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff123f;
    --red-bright: #ff3159;
    --red-dark: #75001d;
    --black: #050205;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 25px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
    background: #030103;
    font-family: 'Montserrat', sans-serif;
}

/* BACKGROUND CYBERPUNK */

.background {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
        linear-gradient(rgba(8,0,5,.48), rgba(4,0,4,.75)),
        url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1800&q=90')
        center / cover no-repeat;
    filter: saturate(1.25);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,.72) 100%),
        linear-gradient(90deg, rgba(255,0,40,.13), transparent 30%, transparent 70%, rgba(255,0,40,.13));
}

/* GRID */

.grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,30,60,.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,30,60,.13) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
}

/* RED ATMOSPHERE */

.ambient {
    position: fixed;
    z-index: -1;
    width: 100vw;
    height: 200px;
    bottom: -80px;
    left: 0;
    pointer-events: none;
    background: radial-gradient(ellipse, rgba(255,0,45,.3), transparent 70%);
    filter: blur(25px);
}

/* MAIN FRAME */

.container {
    width: 100%;
    max-width: 470px;
    position: relative;
    padding: 0 20px 34px;
    isolation: isolate;
    background:
        linear-gradient(180deg, rgba(10,0,5,.78), rgba(4,0,4,.96)),
        url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1000&q=85')
        center / cover;
    border: 1px solid var(--red-bright);
    box-shadow:
        0 0 8px var(--red),
        0 0 22px rgba(255,0,45,.55),
        0 0 65px rgba(255,0,45,.15),
        inset 0 0 35px rgba(255,0,45,.1);
    clip-path: polygon(
        12px 0,
        calc(100% - 12px) 0,
        100% 12px,
        100% calc(100% - 12px),
        calc(100% - 12px) 100%,
        12px 100%,
        0 calc(100% - 12px),
        0 12px
    );
}

.container::before {
    content: "";
    position: absolute;
    inset: 7px;
    z-index: -1;
    border: 1px solid rgba(255,40,75,.22);
    pointer-events: none;
}

/* FRAME CORNER LIGHTS */

.corner {
    position: absolute;
    z-index: 5;
    width: 14px;
    height: 14px;
    border-color: #ff4565;
    border-style: solid;
    filter: drop-shadow(0 0 5px var(--red));
    pointer-events: none;
}

.corner.tl {
    top: 0;
    left: 0;
    border-width: 2px 0 0 2px;
}

.corner.tr {
    top: 0;
    right: 0;
    border-width: 2px 2px 0 0;
}

.corner.bl {
    bottom: 0;
    left: 0;
    border-width: 0 0 2px 2px;
}

.corner.br {
    bottom: 0;
    right: 0;
    border-width: 0 2px 2px 0;
}

/* HERO IMAGE */

.hero {
    height: 235px;
    position: relative;
    margin: 0 -20px;
    overflow: hidden;
    background:
        linear-gradient(180deg, transparent 25%, rgba(5,0,4,.08) 50%, rgba(5,0,4,.8) 100%),
        url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=90')
        center 45% / cover no-repeat;
}

.hero::before {
    content: "";
    position: absolute;
    top: -78px;
    left: 50%;
    width: 210px;
    height: 210px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ff334d 0%, #c00029 38%, rgba(90,0,15,.3) 65%, transparent 75%);
    opacity: .85;
    filter: blur(3px);
    mix-blend-mode: screen;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(0,0,0,.4), transparent 20%, transparent 80%, rgba(0,0,0,.4)),
        linear-gradient(0deg, rgba(5,0,4,.4), transparent 60%);
}

.brand {
    position: relative;
    z-index: 2;
    padding-top: 74px;
    text-align: center;
    white-space: nowrap;
    font-family: 'Rubik Wet Paint', cursive;
    font-size: clamp(43px, 10vw, 65px);
    font-style: italic;
    letter-spacing: -3px;
    line-height: 1.15;
    color: #fff;
    transform: rotate(-4deg);
    -webkit-text-stroke: 1px #ffc0cc;
    text-shadow:
        2px 2px 0 #9c001f,
        4px 4px 0 #39000c,
        0 0 8px #ff173e,
        0 0 20px #ff173e,
        0 0 35px rgba(255,0,50,.8);
}

.brand span {
    display: inline-block;
    color: #ff123b;
    font-size: 1.22em;
    text-shadow:
        2px 2px 0 #8b001a,
        0 0 12px #ff123b,
        0 0 28px #ff123b;
}

/* AVATAR */

.avatar-wrap {
    width: 140px;
    height: 140px;
    position: relative;
    z-index: 3;
    margin: -4px auto 14px;
    padding: 5px;
    border: 3px solid #ff294e;
    border-radius: 50%;
    background: #080207;
    box-shadow:
        0 0 8px #ff123f,
        0 0 18px #ff123f,
        0 0 32px rgba(255,0,55,.55);
}

.avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -10px;
    border: 1px solid rgba(255,30,70,.55);
    border-radius: 50%;
    animation: avatarPulse 2s infinite alternate;
}

.avatar {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    background: #14040b;
}

@keyframes avatarPulse {
    from {
        transform: scale(.98);
        opacity: .35;
    }
    to {
        transform: scale(1.07);
        opacity: .95;
    }
}

/* TAGLINE */

.tagline {
    position: relative;
    z-index: 2;
    margin: 12px 0 20px;
    text-align: center;
    color: #ffb4c3;
    font-size: 10px;
    line-height: 1.8;
    font-weight: 800;
    letter-spacing: 2px;
}

.tagline span {
    color: #ff1744;
    margin: 0 5px;
    text-shadow: 0 0 9px #ff1744;
}

/* MUSIC BOX */

.music-player {
    width: 100%;
    height: 84px;
    display: flex;
    align-items: center;
    gap: 13px;
    position: relative;
    overflow: hidden;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 1px solid #ff244b;
    border-radius: 13px;
    background: linear-gradient(110deg, rgba(25,0,9,.96), rgba(5,0,5,.94));
    box-shadow:
        0 0 8px rgba(255,0,45,.65),
        inset 0 0 18px rgba(255,0,45,.12);
}

.music-player::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(120deg, transparent, rgba(255,0,45,.07), transparent);
}

.music-icon {
    flex-shrink: 0;
    color: #ff2450;
    font-size: 36px;
    filter: drop-shadow(0 0 8px #ff1744);
}

.music-info {
    flex: 1;
    min-width: 0;
}

.music-title {
    margin-bottom: 8px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 3px;
}

.wave {
    height: 22px;
    display: flex;
    align-items: center;
    gap: 3px;
    overflow: hidden;
}

.wave span {
    width: 3px;
    min-width: 2px;
    height: var(--height);
    border-radius: 5px;
    background: #ff1744;
    box-shadow: 0 0 5px #ff1744;
    animation: waveMove .65s ease-in-out infinite alternate;
    animation-delay: var(--delay);
}

.music-player.paused .wave span {
    animation-play-state: paused;
}

@keyframes waveMove {
    from {
        transform: scaleY(.4);
        opacity: .5;
    }
    to {
        transform: scaleY(1);
        opacity: 1;
    }
}

.play-button {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 1px solid #ff1744;
    border-radius: 50%;
    color: #ff1744;
    background: rgba(15,0,6,.95);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,0,55,.3);
    transition: .25s;
}

.play-button:hover {
    color: white;
    background: #ff1744;
    box-shadow: 0 0 20px #ff1744;
}

#music {
    display: none;
}

/* PLATFORM LIST */

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.social-link {
    height: 74px;
    width: 100%;
    display: flex;
    align-items: center;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    color: #fff;
    text-decoration: none;
    background: #080307;
    border: 1px solid #ff3458;
    border-radius: 13px;
    box-shadow:
        0 0 8px rgba(255,0,55,.7),
        0 0 15px rgba(255,0,55,.14),
        inset 0 0 15px rgba(255,0,55,.08);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

/* PLATFORM BACKGROUND IMAGE */

.social-link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background-image: var(--platform-image);
    background-size: cover;
    background-position: center;
    opacity: .48;
    transform: scale(1.02);
    transition: transform .45s ease, opacity .3s ease;
}

/* DARK GRADIENT OVERLAY */

.social-link::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        90deg,
        rgba(5,0,4,1) 0%,
        rgba(5,0,4,.98) 27%,
        rgba(5,0,4,.8) 56%,
        rgba(5,0,4,.23) 100%
    );
}

.social-link:hover {
    transform: translateY(-3px);
    border-color: #ffb7c5;
    box-shadow:
        0 0 10px #ff1744,
        0 0 23px rgba(255,0,55,.7),
        inset 0 0 18px rgba(255,0,55,.16);
}

.social-link:hover::before {
    transform: scale(1.12);
    opacity: .8;
}

/* ANIMATED OVERLAY */

.sweep {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,.06) 40%,
        rgba(255,20,60,.34) 50%,
        rgba(255,255,255,.08) 60%,
        transparent 80%
    );
    transform: translateX(-130%);
}

.social-link:hover .sweep {
    animation: sweepLight .8s ease forwards;
}

@keyframes sweepLight {
    to {
        transform: translateX(130%);
    }
}

/* LEFT LOGO */

.platform-logo {
    width: 83px;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.platform-logo::after {
    content: "";
    position: absolute;
    right: 0;
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: linear-gradient(transparent, #ff1744, transparent);
    box-shadow: 0 0 7px #ff1744;
}

.platform-logo i {
    font-size: 39px;
    filter: drop-shadow(0 0 7px currentColor);
    transition: transform .3s ease, filter .3s ease;
}

.social-link:hover .platform-logo i {
    transform: scale(1.15);
    filter: drop-shadow(0 0 13px currentColor);
}

/* PLATFORM TEXT */

.platform-info {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 2;
    padding-left: 17px;
}

.platform-name {
    display: block;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.4px;
    text-shadow: 0 2px 5px #000;
}

.platform-desc {
    display: block;
    margin-top: 4px;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #ff9daf;
    opacity: 0;
    transform: translateY(5px);
    transition: .25s ease;
}

.social-link:hover .platform-desc {
    opacity: 1;
    transform: translateY(0);
}

/* RIGHT-SIDE PLATFORM ART */

.platform-art {
    width: 82px;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.platform-art i {
    font-size: 49px;
    opacity: .24;
    filter: drop-shadow(0 0 10px currentColor);
    transform: rotate(-10deg);
    transition: .35s ease;
}

.social-link:hover .platform-art i {
    opacity: .65;
    transform: rotate(0deg) scale(1.2);
}

.arrow {
    width: 25px;
    flex-shrink: 0;
    margin-right: 12px;
    text-align: center;
    font-size: 19px;
    color: #ff1744;
    filter: drop-shadow(0 0 6px #ff1744);
    transition: .25s ease;
}

.social-link:hover .arrow {
    transform: translateX(4px);
    color: #fff;
}

/* TIKTOK */

.tiktok {
    --platform-image: url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=85');
}

.tiktok .platform-logo i {
    color: #25f4ee;
    text-shadow: 2px 2px 0 #fe2c55;
}

.tiktok .platform-art {
    color: #ff1744;
}

/* DISCORD */

.discord {
    --platform-image: url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=85');
}

.discord .platform-logo i {
    color: #5865f2;
}

.discord .platform-art {
    color: #777fff;
}

/* YOUTUBE */

.youtube {
    --platform-image: url('https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?auto=format&fit=crop&w=800&q=85');
}

.youtube .platform-logo i {
    color: #ff1238;
}

.youtube .platform-art {
    color: #ff1744;
}

/* SOCIABUZZ */

.sociabuzz {
    --platform-image: url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=85');
}

.sociabuzz .s-logo {
    font-size: 47px;
    font-weight: 900;
    font-style: italic;
    color: #087cff;
    text-shadow: 0 0 10px rgba(0,123,255,.8);
    transform: skew(-12deg);
}

.sociabuzz .platform-art .s-logo {
    font-size: 51px;
    opacity: .32;
}

/* BOTTOM ORNAMENT */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 30px auto 5px;
}

.divider-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff1744);
    box-shadow: 0 0 8px #ff1744;
}

.divider-line:last-child {
    background: linear-gradient(90deg, #ff1744, transparent);
}

.diamond {
    width: 18px;
    height: 18px;
    border: 3px solid #ff1744;
    transform: rotate(45deg);
    box-shadow: 0 0 10px #ff1744, inset 0 0 5px #ff1744;
}

/* MOBILE */

@media (max-width: 400px) {
    body {
        padding: 12px 8px;
    }

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .hero {
        margin-left: -12px;
        margin-right: -12px;
        height: 205px;
    }

    .brand {
        font-size: 44px;
    }

    .avatar-wrap {
        width: 125px;
        height: 125px;
    }

    .tagline {
        font-size: 8px;
        letter-spacing: 1.2px;
    }

    .platform-logo {
        width: 66px;
    }

    .platform-logo i {
        font-size: 33px;
    }

    .platform-info {
        padding-left: 12px;
    }

    .platform-name {
        font-size: 16px;
    }

    .platform-desc {
        font-size: 7px;
    }

    .platform-art {
        width: 48px;
    }

    .platform-art i {
        font-size: 35px;
    }

    .arrow {
        width: 17px;
        margin-right: 8px;
        font-size: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

                <span class="s-logo">S</span>
            </span>

            <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

    </nav>

    <!-- BOTTOM DECORATION -->
    <div class="divider">
        <span class="divider-line"></span>
        <span class="diamond"></span>
        <span class="divider-line"></span>
    </div>

</main>

<script>
const music = document.getElementById("music");
const playButton = document.getElementById("playButton");
const playIcon = document.getElementById("playIcon");
const musicPlayer = document.getElementById("musicPlayer");

playButton.addEventListener("click", async function () {
    if (music.paused) {
        try {
            await music.play();

            playIcon.className = "fa-solid fa-pause";
            playButton.setAttribute("aria-label", "Jeda musik");
            musicPlayer.classList.remove("paused");
        } catch (error) {
            alert("Musik gagal diputar. Passssssstikan file music.mp3 ada di folder yang sama dengan index.html.");
        }
    } else {
        music.pause();

        playIcon.className = "fa-solid fa-play";
        playButton.setAttribute("aria-label", "Putar musik");
        musicPlayer.classList.add("paused");
    }
});

music.addEventListener("ended", function () {
    playIcon.className = "fa-solid fa-play";
    playButton.setAttribute("aria-label", "Putar musik");
    musicPlayer.classList.add("paused");
});
</script>

</body>
</html>
